<html lang="es">

<title>Nemyplish</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: una columna, bloques separados por filetes negros, un visual generativo monocromo por mundo. Sin color: solo negro y blanco. */
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #666666;
  --line: #d6d6d6;
  --line-strong: #000000;
  --inv-bg: #000000;
  --inv-fg: #ffffff;
  --err: #c00000;
  --r-md: 16px;
  --r-lg: 28px;
  --font-sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --fg: #ffffff; --muted: #9a9a9a; --line: #2c2c2c; --line-strong: #ffffff;
    --inv-bg: #ffffff; --inv-fg: #000000; --err: #ff7a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --fg: #ffffff; --muted: #9a9a9a; --line: #2c2c2c; --line-strong: #ffffff;
  --inv-bg: #ffffff; --inv-fg: #000000; --err: #ff7a7a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
}
#app { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }
h1, h2, h3, p, ul, ol { margin: 0; }
h1 { font-stretch: 112%; font-weight: 800; font-size: clamp(34px, 10vw, 56px); line-height: .98; letter-spacing: -.025em; text-transform: uppercase; }
h2 { font-stretch: 106%; font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -.012em; text-wrap: balance; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.wordmark { font-stretch: 125%; font-weight: 900; font-size: 18px; letter-spacing: .12em; }

.hero { position: relative; width: 100%; min-width: 0; background: var(--inv-bg); color: var(--inv-fg); aspect-ratio: 16 / 10; min-height: 250px; max-height: 380px; padding: 20px; border-radius: var(--r-lg); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-row { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.hero-row.top { align-items: flex-start; }
.big { font-stretch: 125%; font-weight: 900; font-size: clamp(54px, 16vw, 92px); line-height: .86; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.big.sm { font-size: clamp(30px, 8vw, 44px); }
.hero .right { text-align: right; }
.segs { display: flex; gap: 4px; margin-top: 8px; }
.segs i { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
.segs i.done { background: var(--fg); }
.segs i.now { background: var(--fg); opacity: .35; }

.block { border-top: 1px solid var(--line-strong); padding-top: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.chip { align-self: flex-start; border: 1px solid var(--fg); border-radius: 999px; padding: 3px 12px; overflow-wrap: anywhere; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-stretch: 125%; font-weight: 900; font-size: 15px; }
.nemy { display: flex; align-items: center; gap: 12px; }
.nemy b { display: block; line-height: 1.2; }

input[type="text"], input[type="email"], textarea { width: 100%; font: inherit; font-size: 16px; color: var(--fg); padding: 12px 16px; border: 1px solid var(--fg); border-radius: var(--r-md); background: transparent; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.btn { width: 100%; font: inherit; font-weight: 700; font-size: 15px; letter-spacing: .02em; color: var(--bg); background: var(--fg); border: 1px solid var(--fg); border-radius: 999px; padding: 14px 24px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--bg); color: var(--fg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.quiet { color: var(--fg); background: transparent; }
.btn.quiet:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
.btn.small-btn { width: auto; align-self: flex-start; padding: 9px 16px; font-size: 14px; }
.btn.danger { border-color: var(--err); background: var(--err); color: var(--bg); }
.link { align-self: flex-start; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.link:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; }
.row > * { min-width: 0; }
.row .btn { width: auto; flex: none; }
.row input { flex: 1; }
.field { display: flex; flex-direction: column; gap: 8px; }

.topics, .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip, .opt { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--fg); cursor: pointer; padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; }
.tchip:hover, .opt:hover { background: var(--fg); color: var(--bg); }
.opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.steps { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.steps li { border-bottom: 1px solid var(--line); }
.steps label { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; cursor: pointer; font-weight: 600; }
.steps input { appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 2px 0 0; border: 1.5px solid var(--fg); border-radius: 7px; background: transparent; display: grid; place-content: center; cursor: pointer; }
.steps input:checked { background: var(--fg); }
.steps input:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(-45deg) translate(1px, -1px); }
.steps input:checked + span { color: var(--muted); text-decoration: line-through; }

.chatlog { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
.msg { max-width: 90%; padding: 10px 16px; border-radius: 20px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; border: 1px solid var(--fg); border-bottom-left-radius: 6px; }
.msg.user { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 6px; }
.dots { display: inline-flex; gap: 4px; padding-block: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,60%,100% { opacity: .2; } 30% { opacity: 1; } }
.status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 600; }
.err { font-size: 13px; font-weight: 600; color: var(--err); }
.err:empty { display: none; }
.notice { border: 1px solid var(--fg); border-radius: var(--r-md); padding: 14px 16px; }
.notice b { display: block; }

.gain { font-stretch: 125%; font-weight: 900; font-size: clamp(70px, 24vw, 128px); line-height: .85; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.why { padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-md); }

.mods { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mod { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mod-head { display: flex; gap: 16px; align-items: flex-start; }
.mod-n { flex: none; width: 40px; font-stretch: 125%; font-weight: 900; font-size: 26px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.mod-head b { display: block; line-height: 1.3; overflow-wrap: anywhere; }
.reading { display: flex; flex-direction: column; gap: 14px; font-family: var(--font-serif); font-size: 17px; line-height: 1.7; max-width: 62ch; padding-left: 56px; overflow-wrap: anywhere; }
.reading:empty { display: none; }
.mod > :not(.mod-head):not(.reading) { margin-left: 56px; }
.buy { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.price b { display: block; font-stretch: 125%; font-weight: 900; font-size: 52px; line-height: .9; letter-spacing: -.04em; }
.buy .btn { width: auto; flex: 1 1 220px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--fg); border-radius: var(--r-md); overflow: hidden; }
.stat { padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--fg); }
.stat b { font-stretch: 118%; font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.log { list-style: none; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.log li { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.setting { display: flex; flex-direction: column; gap: 10px; }
.setting + .setting { border-top: 1px solid var(--line); padding-top: 18px; }

.auth { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
.auth h1 { font-size: clamp(44px, 14vw, 84px); }

.tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 696px; margin-inline: auto; z-index: 5; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px; }
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab { position: relative; font: inherit; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: none; border: 0; padding: 9px 4px 8px; border-radius: 999px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
.tab[aria-current="page"] { color: var(--bg); background: var(--fg); }

.travel { position: fixed; inset: 0; z-index: 10; display: grid; align-content: end; padding: 24px; background: var(--inv-bg); color: var(--inv-fg); animation: fade .35s ease both; }
.travel .big { font-size: clamp(48px, 15vw, 120px); line-height: .9; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.foot { align-self: center; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 6px; }
@media (max-width: 480px) { .reading { padding-left: 0; } .mod > :not(.mod-head):not(.reading) { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .dots i, .travel { animation: none; } }

/* ---- Capa visual ---- */
.hero { aspect-ratio: 4 / 3; min-height: 300px; max-height: 460px; }
.orb { flex: none; display: block; color: var(--fg); }
.orb .orbit, .orb .ring { transform-origin: 24px 24px; }
.orb .orbit { animation: spin 6s linear infinite; }
.orb .ring { animation: spin 24s linear infinite reverse; }
.orb .core { transform-origin: 24px 24px; animation: breathe 3s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.5); } }
.hello { display: flex; align-items: flex-end; gap: 14px; }
.bubble { position: relative; border: 1px solid var(--fg); border-radius: 22px; border-bottom-left-radius: 6px; padding: 14px 18px; font-weight: 600; font-size: 15px; line-height: 1.4; }
.map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.world { position: relative; overflow: hidden; min-width: 0; aspect-ratio: 3 / 4; border: 1px solid var(--line-strong); border-radius: var(--r-lg); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: var(--fg); background: var(--bg); }
.world canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.world.now { background: var(--inv-bg); color: var(--inv-fg); }
.world.todo { border-color: var(--line); }
.world.todo canvas { opacity: .4; }
.wl { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: var(--r-md); background: var(--bg); color: var(--fg); min-width: 0; }
.world.now .wl { background: var(--inv-bg); color: var(--inv-fg); }
.wl b { font-stretch: 100%; font-weight: 800; font-size: 12px; line-height: 1.1; letter-spacing: -.02em; }
.pips { display: flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
.pips i.on { background: currentColor; }
.pop { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--inv-bg); color: var(--inv-fg); padding: 22px; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.pop i { position: absolute; right: -8%; top: 50%; width: 62%; aspect-ratio: 1; margin-top: -31%; border-radius: 50%; border: 1px solid currentColor; opacity: 0; animation: ring 3s ease-out infinite; }
.pop i:nth-child(2) { animation-delay: 1s; } .pop i:nth-child(3) { animation-delay: 2s; }
@keyframes ring { from { transform: scale(.2); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
.pop > :not(i) { position: relative; }
.steps { border-top: 0; gap: 8px; }
.steps li { border: 1px solid var(--line-strong); border-radius: var(--r-md); }
.steps li:has(input:checked) { border-color: var(--line); }
.steps label { padding: 14px 16px; }
.mods { border-top: 0; gap: 10px; }
.mod { border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 18px; }
.mod-n { font-size: 34px; width: 48px; }
.log { border-top: 0; gap: 8px; }
.log li { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvgrid i { aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--line); display: grid; place-items: center; font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.lvgrid i.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.lvgrid i.cur { border: 2px solid var(--fg); color: var(--fg); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.92); } }
@media (prefers-reduced-motion: reduce) { .orb .orbit, .orb .ring, .orb .core, .pop i, .lvgrid i.cur { animation: none; } }
</style>

<script>
(function () {
  var CONFIG = { SUPABASE_URL: 'https://psjaqhemphdscchclclz.supabase.co', SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzamFxaGVtcGhkc2NjaGNsY2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NDI0OTIsImV4cCI6MjEwNzExODQ5Mn0.MT9jWqST9KiV3k8YqLC0LJiINMEsXn0jrq-2sZBCAIY' };

  var Prompts = (function () {
// Prompts y validación de entradas de Nemy.
// Se usan en la Edge Function `nemy` (servidor) y se incrustan tal cual en el modo demo del frontend.
// Solo texto y funciones puras. Al incrustarlo en el HTML se eliminan los "export ".

function clip(v, n) {
  return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n);
}
function list(a, n) { return Array.isArray(a) ? a.slice(0, n) : []; }
function int(v, min, max, d) {
  var n = parseInt(v, 10);
  if (isNaN(n)) return d;
  return Math.max(min, Math.min(max, n));
}
function cleanProfile(p) {
  p = p && typeof p === 'object' ? p : {};
  return { level: clip(p.level, 20), time: clip(p.time, 30), aim: clip(p.aim, 140) };
}
function cleanLog(a) {
  return list(a, 15).map(function (l) {
    l = l || {};
    return { goal: clip(l.goal, 100), note: clip(l.note, 300), feedback: clip(l.feedback, 200) };
  });
}
function cleanMaster(m) {
  m = m && typeof m === 'object' ? m : {};
  return {
    title: clip(m.title, 90), promise: clip(m.promise, 240), why: clip(m.why, 260),
    modules: list(m.modules, 5).map(function (x) { x = x || {}; return { t: clip(x.t, 80), d: clip(x.d, 170) }; })
  };
}
function cleanMessages(a) {
  var out = list(a, 12).map(function (m) {
    m = m || {};
    return { role: m.role === 'assistant' ? 'assistant' : 'user', content: clip(m.content, 600) };
  }).filter(function (m) { return m.content; });
  while (out.length && out[0].role !== 'user') out.shift();
  while (out.length && out[out.length - 1].role !== 'user') out.pop();
  return out;
}

function sanitize(task, raw) {
  var r = raw && typeof raw === 'object' ? raw : {};
  var base = { topic: clip(r.topic, 80), name: clip(r.name, 40), levelLabel: clip(r.levelLabel, 70) };
  if (task === 'suggest') {
    return Object.assign(base, { history: list(r.history, 6).map(function (x) { return clip(x, 100); }) });
  }
  if (task === 'steps') return Object.assign(base, { goal: clip(r.goal, 100) });
  if (task === 'evaluate') {
    return Object.assign(base, {
      goal: clip(r.goal, 100), note: clip(r.note, 600),
      steps: list(r.steps, 3).map(function (s) { s = s || {}; return { t: clip(s.t, 120), done: !!s.done }; })
    });
  }
  if (task === 'design_master') {
    return Object.assign(base, { xp: int(r.xp, 0, 100000, 0), mprofile: cleanProfile(r.mprofile), log: cleanLog(r.log) });
  }
  if (task === 'lesson') {
    return Object.assign(base, {
      xp: int(r.xp, 0, 100000, 0), mprofile: cleanProfile(r.mprofile), log: cleanLog(r.log),
      master: cleanMaster(r.master), index: int(r.index, 0, 4, 0)
    });
  }
  if (task === 'chat') {
    return Object.assign(base, {
      goal: clip(r.goal, 100),
      steps: list(r.steps, 3).map(function (s) { s = s || {}; return { t: clip(s.t, 120), done: !!s.done }; }),
      tone: r.tone === 'directo' ? 'directo' : 'cercano',
      length: r.length === 'breve' || r.length === 'detallada' ? r.length : 'normal',
      messages: cleanMessages(r.messages)
    });
  }
  return base;
}

var BASE = 'Eres Nemy, mentora de una app de aprendizaje por niveles. Escribes en español, con claridad y rigor profesional, sin emojis. ' +
  'Si no sabes algo, lo dices. Nunca inventas datos, estadísticas, estudios ni fuentes.';

function ctx(i) {
  return 'Tema: ' + i.topic + '.' + (i.levelLabel ? ' ' + i.levelLabel + '.' : '') + (i.name ? ' La persona se llama ' + i.name + '.' : '');
}
function profileBlock(i) {
  var p = i.mprofile || {};
  var log = (i.log || []).map(function (l, n) {
    return (n + 1) + '. Objetivo: ' + l.goal + ' | Lo que contó: ' + l.note + ' | Evaluación de Nemy: ' + l.feedback;
  }).join('\n') || 'Sin registros.';
  return 'Tema: ' + i.topic + '.' + (i.name ? ' La persona se llama ' + i.name + '.' : '') +
    '\nNivel que se atribuye: ' + p.level + '. Tiempo disponible: ' + p.time + '.\nQué quiere conseguir: ' + p.aim +
    '.\nHistorial del recorrido (' + i.xp + ' XP):\n' + log;
}

// Devuelve { tier: 'fast'|'smart', json: bool, stream: bool, maxTokens, system, messages }.
function build(task, i) {
  if (task === 'suggest') {
    return {
      tier: 'fast', json: true, stream: false, maxTokens: 200, system: BASE,
      messages: [{ role: 'user', content: ctx(i) + ' Propón un objetivo concreto, medible y que se pueda terminar en una sola sesión, adecuado a ese nivel de dificultad. ' +
        'No repitas estos: ' + ((i.history || []).join(' | ') || 'ninguno') + '. Responde solo con JSON: {"goal":"máximo 14 palabras"}' }]
    };
  }
  if (task === 'steps') {
    return {
      tier: 'fast', json: true, stream: false, maxTokens: 300, system: BASE,
      messages: [{ role: 'user', content: ctx(i) + ' Objetivo: ' + i.goal + '. Da tres pasos concretos y ordenados para lograrlo, cada uno de máximo 12 palabras. ' +
        'Responde solo con JSON: {"steps":["...","...","..."]}' }]
    };
  }
  if (task === 'evaluate') {
    var st = (i.steps || []).map(function (s) { return s.t + (s.done ? ' (hecho)' : ' (sin hacer)'); }).join('; ');

  async function sendChat() {
    var input = document.getElementById('f-chat');
    var text = (draft.chat || '').trim();
    if (!text || chatBusy) return;
    draft.chat = ''; if (input) input.value = ''; chatErr = '';
    chat.push({ role: 'user', content: text });
    var reply = { role: 'assistant', content: '' };
    chat.push(reply);
    chatBusy = true; ctl = new AbortController(); renderChat();
    var msgs = chat.slice(0, -1).filter(function (m) { return m.content; }).map(function (m) { return { role: m.role, content: m.content }; });

      reply.content = await aiStream('chat', {
        topic: S.topic, name: S.name, levelLabel: levelLabel(), goal: S.goal, steps: S.steps,

      if (e && e.text) reply.content = e.text;
      if (e && e.code !== 'cancelled') chatErr = copy(e && e.code);

      if (!reply.content) chat.pop();
      chatBusy = false; ctl = null; renderChat();
    }
  }

    toggle: function () { completing = !completing; errMsg = ''; render(); },
    submit: async function () {
      var note = (draft.note || '').trim();
      if (note.length < 12) { errMsg = 'Escribe al menos una frase sobre lo que lograste.'; render(); return; }
      busy = 'eval'; errMsg = ''; render();
      var doneN = S.steps.filter(function (s) { return s.done; }).length;
      var out = null;
      try { out = await aiJson('evaluate', { topic: S.topic, name: S.name, levelLabel: levelLabel(), goal: S.goal, note: note, steps: S.steps }); }
      catch (e) { errMsg = copy(e && e.code); }
      var gain, feedback, lesson;
      if (out && typeof out.xp === 'number' && out.lesson && out.lesson.title) {
        gain = Math.max(30, Math.min(100, Math.round(out.xp)));
        feedback = String(out.feedback || '').slice(0, 400);
        lesson = { title: String(out.lesson.title).slice(0, 80), body: String(out.lesson.body || '').slice(0, 500) };
      } else {
        var fl = FALLBACK_LESSONS[(globalLevel() - 1) % FALLBACK_LESSONS.length];
        gain = 60 + 10 * doneN; feedback = 'Nemy no estuvo disponible, así que el XP se calculó por los pasos marcados.'; lesson = { title: fl[0], body: fl[1] };
      }
      S.log = S.log.concat({ goal: S.goal.slice(0, 100), note: note.slice(0, 300), feedback: feedback.slice(0, 200) }).slice(-15);
      S.gain = gain; S.feedback = feedback; S.lesson = lesson; S.totalXp += gain; S.phase = 'reward';
      busy = null; errMsg = ''; completing = false; draft.note = '';
      save(); render(); window.scrollTo(0, 0);
    },
    next: function () { S.level += 1; resetLevel(); save(); render(); window.scrollTo(0, 0); },
    finish: function () { S.finished = true; errMsg = ''; save(); render(); window.scrollTo(0, 0); },
    travel: function () {
      if (traveling) return; traveling = true;
      var nxt = WORLDS[S.world];
      var ov = document.createElement('div'); ov.className = 'travel'; ov.setAttribute('role', 'status');
      ov.innerHTML = '<div><div class="mono">Mundo ' + (S.world + 1) + ' / 3 · ' + esc(nxt.sub) + '</div><div class="big">' + esc(nxt.name.toUpperCase()) + '</div></div>';
      document.body.appendChild(ov);
      setTimeout(function () {
        S.world += 1; S.level = 0; resetLevel(); save(); render(); window.scrollTo(0, 0);
        ov.style.transition = 'opacity .5s'; ov.style.opacity = '0';
        setTimeout(function () { ov.remove(); traveling = false; }, 550);
      }, 1300);
    },
    opt: function (b) { S.mprofile[b.getAttribute('data-k')] = b.getAttribute('data-v'); save(); render(); },
    design: function () { designMaster(); },
    buy: function () { buy(); },
    redo: function () { S.master = null; errMsg = ''; save(); render(); window.scrollTo(0, 0); },
    lesson: function (b) { genLesson(+b.getAttribute('data-i')); },
    set: function (b) { S.settings[b.getAttribute('data-k')] = b.getAttribute('data-v'); save(); render(); },
    gotolearn: function () { setTab('learn'); },
    exportData: async function () {
      var data = {
        app: 'Nemyplish', exportedAt: new Date().toISOString(), name: S.name, topic: S.topic, xp: S.totalXp,
        world: S.world, level: S.level + 1, finished: S.finished, goals: S.log,
        masterclass: S.master ? { title: S.master.title, promise: S.master.promise, modules: S.master.modules } : null
      };
      try { await saveFile('nemyplish-progreso.json', JSON.stringify(data, null, 2)); errMsg = ''; }
      catch (e) { if (e && e.code !== 'declined') { errMsg = 'No se pudo guardar el archivo. Inténtalo de nuevo.'; render(); } }
    },
    login: async function () {
      var email = (draft.email || '').trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { errMsg = 'Escribe un correo válido.'; render(); return; }
      busy = 'login'; errMsg = ''; render();
      var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
      busy = null;
      if (r.error) errMsg = 'No se pudo enviar el enlace. Revisa el correo e inténtalo de nuevo.'; else authSent = true;
      render();
    },
    signout: async function () { if (sb) await sb.auth.signOut(); },
    again: function () { fullReset(); },
    askreset: function () { confirmReset = true; render(); },
    reset: function () { fullReset(); },
    send: function () { sendChat(); },
    stop: function () { if (ctl) ctl.abort(); }
  };

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act !== 'askreset' && act !== 'reset' && confirmReset) confirmReset = false;
    var fn = acts[act]; if (fn) fn(b);
  });
  app.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'f-topic') draft.topic = e.target.value;
    else if (id === 'f-goal') draft.goal = e.target.value;
    else if (id === 'f-note') draft.note = e.target.value;
    else if (id === 'f-chat') draft.chat = e.target.value;
    else if (id === 'f-email') draft.email = e.target.value;
    else if (id === 'f-aim') S.mprofile.aim = e.target.value;
    else if (id === 'f-name') S.name = e.target.value;
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'f-name') { save(); return; }
    var i = e.target.getAttribute && e.target.getAttribute('data-step');
    if (i !== null && i !== undefined && S.steps[+i]) { S.steps[+i].done = e.target.checked; save(); }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    var id = e.target.id;
    if (id === 'f-topic') { e.preventDefault(); acts.topic(); }
    else if (id === 'f-goal') { e.preventDefault(); acts.start(); }
    else if (id === 'f-chat') { e.preventDefault(); sendChat(); }
    else if (id === 'f-aim') { e.preventDefault(); designMaster(); }
    else if (id === 'f-email') { e.preventDefault(); acts.login(); }
  });
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (b) setTab(b.getAttribute('data-tab'));
  });

  /* ---------- Arranque ---------- */
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
    });
  }
  async function afterLogin() {
    var uid = session.user.id;
    var r = await sb.from('app_state').select('state').eq('user_id', uid).maybeSingle();
    if (r.data && r.data.state) S = normalize(r.data.state); else { S = fresh(); saveNow(); }
    await checkEntitlement();
    view = 'app'; render();
    var q = new URLSearchParams(window.location.search);
    if (q.get('paid') === '1') {
      history.replaceState(null, '', window.location.pathname);
      tab = 'learn';
      if (!entitled) await waitForPayment(); else { payNotice = 'Pago recibido. Masterclass desbloqueada.'; render(); }
    } else if (q.get('paid') === '0') {
      history.replaceState(null, '', window.location.pathname);
    }
  }
  async function bootBackend() {
    if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || CONFIG.SUPABASE_URL.indexOf('__') === 0) { view = 'setup'; render(); return; }
    render();
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'); }
    catch (e) { view = 'offline'; render(); return; }
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    var cur = await sb.auth.getSession();
    session = cur.data.session;
    sb.auth.onAuthStateChange(function (ev, s) {
      var had = !!session;
      session = s;
      if (s && !had) afterLogin();
      else if (!s && had) { S = fresh(); entitled = false; chat = []; view = 'auth'; authSent = false; render(); }
    });
    if (session) await afterLogin(); else { view = 'auth'; render(); }
  }
  async function bootDemo() {
    render();
    try {
      sample = await window.claude.use('sample');
      downloads = await window.claude.use('downloads');
      if (tab === 'settings') render();
    } catch (e) {}
  }
  if (DEMO) bootDemo(); else bootBackend();
})();
</script>
